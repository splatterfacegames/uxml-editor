name: Deploy site to Cloudflare Pages

# https://uxml-editor.splatterfacegames.com: the page in site/public, the Web
# export of the editor in /editor/ and the sample project
# (/editor/?sample=sample), built by site/build.sh. Files over the Pages
# limit go to the R2 bucket uxml-editor-web; site/functions serves them.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
      - "src/**"
      - "addons/**"
      - "fixtures/projects/**"
      - "export_presets.cfg"
      - "project.godot"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1
  WRANGLER_VERSION: 4.127.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the godot-uxml copy against the pin
        run: python3 tools/update_godot_uxml.py --verify
      - name: Install Godot and the Web export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -q templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          godot --version
      - name: Build the page, the Web export and the sample project
        run: GODOT=godot bash site/build.sh
      - name: Upload the large editor files to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd site/.r2-upload
          find . -type f | sed 's|^\./||' | while read -r key; do
            case "$key" in
              *.wasm) type=application/wasm ;;
              *) type=application/octet-stream ;;
            esac
            npx --yes "wrangler@${WRANGLER_VERSION}" r2 object put "uxml-editor-web/$key" \
              --file "$key" --content-type "$type" --remote
          done
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: site
          command: pages deploy --branch=main --commit-dirty=true
