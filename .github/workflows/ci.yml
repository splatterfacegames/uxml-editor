name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web (typecheck, unit, e2e, build)
    # sg-uxml-editor on stadia-testbed: rustup/stable, setup-node, webkit2gtk,
    # jq, pwsh, and Chrome are provisioned on the box.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate private shared-stack dependency
        shell: bash
        env:
          UXML_EDITOR_SHARED_STACK_READ_TOKEN: ${{ secrets.UXML_EDITOR_SHARED_STACK_READ_TOKEN }}
          UXML_EDITOR_SHARED_STACK_DEPLOY_KEY: ${{ secrets.UXML_EDITOR_SHARED_STACK_DEPLOY_KEY }}
        run: bash scripts/configure-shared-stack-auth.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No cache: on setup-node — its post-job npm-cache save uploads to the
      # actions cache service, which intermittently stalls on this box's Azure
      # egress (observed: >20 min in post steps). npm ci is fast enough without
      # it; the git dependency dominates install time regardless.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The box has no passwordless sudo contract, so install the browser only;
      # Chrome's provisioned system libraries already satisfy it.
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run check:licenses
      # stadia-testbed's Azure egress intermittently stalls large uploads; the
      # dist bundle is reproducible, so never fail the leg on an upload stall.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: browser-build
          path: dist
          if-no-files-found: error

  host-linux:
    name: 'Host (Linux: fmt, clippy, tests)'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # PR runs restore the cache but never save: the post-job cache
          # upload stalls on stadia-testbed's Azure egress. Main pushes keep
          # the cache warm without gating pull requests on the upload.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Tauri system dependencies
        # The self-hosted box already ships webkit2gtk; keep the install for a
        # hypothetical github-hosted fallback only.
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libjavascriptcoregtk-4.1-dev pkg-config
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  host-windows:
    name: 'Host (Windows: tests, desktop build)'
    # GitHub-hosted: there is no self-hosted Windows runner. When org Actions
    # quota is exhausted this job queues without starting — in that state the
    # native-Windows verification in the PR body is the authoritative evidence.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate private shared-stack dependency
        shell: bash
        env:
          UXML_EDITOR_SHARED_STACK_READ_TOKEN: ${{ secrets.UXML_EDITOR_SHARED_STACK_READ_TOKEN }}
          UXML_EDITOR_SHARED_STACK_DEPLOY_KEY: ${{ secrets.UXML_EDITOR_SHARED_STACK_DEPLOY_KEY }}
        run: bash scripts/configure-shared-stack-auth.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Windows is the only platform where conditional replacement is
      # implemented, so it is the only one that proves the atomic-save contract.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - run: npx tauri build --no-bundle
